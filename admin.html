<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f">
<title>Admin • ตีให้สุด หยุดที่เบ้าตา</title>
<style>
:root{--bg:#07111f;--card:#0f1d31;--line:#263b59;--text:#f7fbff;--muted:#91a4be;--gold:#f6c94c;--blue:#3b82f6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(180deg,#07111f,#091524);color:var(--text)}
main{max-width:900px;margin:auto;padding:14px 12px 80px}.hero,.card{background:#0f1d31;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}h1,h2{margin:0 0 7px}.muted{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a{border:0;border-radius:11px;padding:10px 13px;min-height:42px;font-weight:850;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:#efc13d;color:#17120a}.blue{background:#3275da;color:#fff}.danger{background:#44222b;color:#ffc6ce;border:1px solid #6c3340}.secondary{background:#173052;color:#dceaff;border:1px solid #31547e}
input,select{width:100%;min-height:44px;border-radius:11px;border:1px solid #3a4d69;background:#0b1626;color:#fff;padding:0 10px;font-size:15px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}.account{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #263851}.account:last-child{border-bottom:0}.account strong{display:block}.account small{color:var(--muted);display:block;margin-top:3px}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;background:#5a4514;color:#ffe087;font-size:10px;font-weight:900}
.account-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.account-actions button{min-height:36px;padding:7px 9px;font-size:11px}.off{opacity:.55}
.notice{padding:10px;border-radius:12px;background:#0b1728;border:1px solid #29405f;color:#cfe1fb;font-size:12px;line-height:1.45}
@media(max-width:650px){.form{grid-template-columns:1fr}.account{grid-template-columns:1fr}.account-actions{justify-content:flex-start}}
</style>
</head>
<body>
<main>
<section class="hero">
 <h1>⚙️ Admin Center</h1>
 <div class="muted">จัดการบัญชีผู้เล่นด้วย user_id • เพิ่มผู้เล่นใหม่ได้เฉพาะ Admin</div>
 <div class="actions"><a class="secondary" href="index.html">← กลับหน้าการแข่งขัน</a></div>
</section>
<section class="card">
 <h2>➕ เพิ่มบัญชีผู้เล่น</h2>
 <div class="notice">บัญชีใหม่จะมี PIN เริ่มต้น <b>1234</b> และมี user_id ถาวร ประวัติจะผูกกับ user_id ไม่ใช่ชื่อ</div>
 <div class="form"><input id="newName" placeholder="ชื่อผู้เล่น"><select id="newRole"><option value="player">Player</option><option value="admin">Admin</option></select><button class="primary" id="create">สร้างบัญชี</button></div>
</section>
<section class="card">
 <h2>👥 บัญชีทั้งหมด</h2>
 <div id="accounts"></div>
</section>
</main>
<script>
const KEY="pp_league_v7_uid",SUPABASE_URL="https://gqlfqoeejgtjpsdvngbh.supabase.co",SUPABASE_KEY="sb_publishable_A26ocTxGPkLry2Y2iBY2mA_kTWNRI4Z",CLOUD_ENDPOINT=`${SUPABASE_URL}/rest/v1/app_state?id=eq.main`;
let state=JSON.parse(localStorage.getItem(KEY)||"null"),currentUserId=localStorage.getItem("pp_user_id")||"";if(!state?.profiles){location.href="index.html"}
const esc=v=>String(v).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));const uid=()=>`u_${Math.random().toString(36).slice(2,8)}${Date.now().toString(36).slice(-4)}`;const me=()=>state.profiles[currentUserId];if(me()?.role!=="admin"){alert("หน้านี้สำหรับ Admin เท่านั้น");location.href="index.html"}
async function cloudRequest(method="GET",body=null){const o={method,headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}};if(body){o.headers["Content-Type"]="application/json";o.headers.Prefer="return=representation";o.body=JSON.stringify(body)}const r=await fetch(`${CLOUD_ENDPOINT}&select=league,updated_at`,o);if(!r.ok)throw new Error(r.status);return r.json()}
function save(){localStorage.setItem(KEY,JSON.stringify(state));cloudRequest("PATCH",{league:{uidLeague:state},updated_at:new Date().toISOString()}).catch(()=>{})}
function render(){document.getElementById("accounts").innerHTML=Object.values(state.profiles).sort((a,b)=>(b.role==="admin")-(a.role==="admin")||a.displayName.localeCompare(b.displayName,"th")).map(p=>`<div class="account ${p.active===false?"off":""}"><div><strong>${esc(p.displayName)} ${p.role==="admin"?'<span class="badge">ADMIN</span>':""}</strong><small>${p.id} • ${p.active===false?"Inactive":"Active"}</small></div><div class="account-actions"><button class="secondary" data-rename="${p.id}">เปลี่ยนชื่อ</button><button class="blue" data-reset="${p.id}">รีเซ็ต PIN</button><button class="${p.active===false?"primary":"danger"}" data-toggle="${p.id}">${p.active===false?"เปิดใช้งาน":"ปิดใช้งาน"}</button></div></div>`).join("");
 document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{const p=state.profiles[b.dataset.reset];if(confirm(`รีเซ็ต PIN ของ ${p.displayName} เป็น 1234?`)){p.pin="1234";save();alert("รีเซ็ตแล้ว")}});
 document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const p=state.profiles[b.dataset.toggle];if(p.id===currentUserId&&p.active!==false){alert("ปิดบัญชี Admin ที่กำลังใช้งานไม่ได้");return}p.active=p.active===false?true:false;save();render()});
 document.querySelectorAll("[data-rename]").forEach(b=>b.onclick=()=>{const p=state.profiles[b.dataset.rename],name=prompt("ชื่อใหม่",p.displayName);if(!name?.trim())return;p.displayName=name.trim();save();render()});
}
document.getElementById("create").onclick=()=>{const name=document.getElementById("newName").value.trim(),role=document.getElementById("newRole").value;if(!name)return alert("กรอกชื่อก่อน");if(Object.values(state.profiles).some(p=>p.displayName.toLowerCase()===name.toLowerCase()))return alert("มีชื่อนี้แล้ว");const id=uid();state.profiles[id]={id,displayName:name,pin:"1234",role,active:true,createdAt:new Date().toISOString()};document.getElementById("newName").value="";save();render();alert(`สร้าง ${name} แล้ว • PIN 1234`)}
render();
</script>
</body>
</html>
