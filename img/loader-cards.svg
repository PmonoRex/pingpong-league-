<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Dummy page-change loader (motion.css html.pt-cards::after): a deck fanned into a ring that spins, 1.8s a turn. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="back" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff4752"/><stop offset=".55" stop-color="#d81e29"/><stop offset="1" stop-color="#8e0f17"/></linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="rgba(255,255,255,.28)"/></pattern>
    <g id="card"><rect x="-13" y="-62" width="26" height="38" rx="4" fill="url(#back)" stroke="#fff" stroke-width="1.6"/><rect x="-9" y="-58" width="18" height="30" rx="2.5" fill="url(#dots)"/></g>
  </defs>
  <g transform="translate(100 100)" filter="url(#glow)">
    <g>
      <use href="#card"/><use href="#card" transform="rotate(36)"/><use href="#card" transform="rotate(72)"/><use href="#card" transform="rotate(108)"/><use href="#card" transform="rotate(144)"/>
      <use href="#card" transform="rotate(180)"/><use href="#card" transform="rotate(216)"/><use href="#card" transform="rotate(252)"/><use href="#card" transform="rotate(288)"/><use href="#card" transform="rotate(324)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
    <!-- a face card in the middle, flipping on its axis -->
    <g>
      <rect x="-16" y="-23" width="32" height="46" rx="5" fill="#f4f5f7"/>
      <path d="M0 -11 C6 -4 12 0 12 5 C12 9 8 11 4 9 C5 12 6 14 8 15 H-8 C-6 14 -5 12 -4 9 C-8 11 -12 9 -12 5 C-12 0 -6 -4 0 -11 Z" fill="#0a0b0e"/>
      <animateTransform attributeName="transform" type="scale" values="1 1;0.08 1;1 1" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
