<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150">
  <!-- Page-change loader (motion.css html.pt-*::after): two players rally a ball over the net, 1.4s per exchange. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="tbl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2a1216"/><stop offset="1" stop-color="#14070a"/></linearGradient>
  </defs>
  <!-- table and net -->
  <path d="M28 112 L212 112 L222 122 L18 122 Z" fill="url(#tbl)" stroke="#ff4752" stroke-width="1.4" filter="url(#glow)"/>
  <path d="M120 98 V112" stroke="#f4f5f7" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 122 V138 M210 122 V138" stroke="#3a3f4a" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#f4f5f7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- left player -->
    <circle cx="16" cy="54" r="7" fill="#f4f5f7" stroke="none"/>
    <path d="M17 62 L22 90 M22 90 L12 116 M22 90 L30 116 M19 70 L8 84"/>
    <g>
      <path d="M19 70 L34 66"/><circle cx="40" cy="64" r="7" fill="#e5242f" stroke="#ff8a92" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" values="20 19 70;-28 19 70;20 19 70;20 19 70" keyTimes="0;0.06;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <!-- right player -->
    <circle cx="224" cy="54" r="7" fill="#f4f5f7" stroke="none"/>
    <path d="M223 62 L218 90 M218 90 L228 116 M218 90 L210 116 M221 70 L232 84"/>
    <g>
      <path d="M221 70 L206 66"/><circle cx="200" cy="64" r="7" fill="#e5242f" stroke="#ff8a92" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" values="-20 221 70;-20 221 70;28 221 70;-20 221 70;-20 221 70" keyTimes="0;0.44;0.5;0.64;1" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- ball: left paddle, bounce on the far side, right paddle, bounce on the near side, back -->
  <circle r="4.2" fill="#fff" filter="url(#glow)">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M40 64 Q100 6 156 110 Q176 72 200 64 Q140 6 84 110 Q64 72 40 64"/>
  </circle>
</svg>
