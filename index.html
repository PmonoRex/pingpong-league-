<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f18">
<title>ตีให้สุด หยุดที่เบ้าตา</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0b0f18;color:#fff;-webkit-text-size-adjust:100%}
main{max-width:1100px;margin:auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.hero,.card{background:#131a2a;border:1px solid #2d3954;border-radius:18px;padding:16px;margin-bottom:14px}
h1{margin:0;font-size:clamp(30px,5vw,48px);line-height:1.15}.sub{color:#f2cf6b;margin-top:6px}
.rules{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{border:1px solid #3b4967;border-radius:999px;padding:7px 10px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.round{margin-bottom:16px}.rh{display:flex;justify-content:space-between;margin-bottom:8px}.rest{color:#9ba8c0;font-size:12px}
.match{background:#182238;border:1px solid #2d3954;border-radius:12px;padding:10px;margin-bottom:8px}
.pair{display:grid;grid-template-columns:minmax(64px,1fr) 64px auto 64px minmax(64px,1fr);gap:7px;align-items:center}.left{text-align:right}
input{width:100%;min-height:44px;border-radius:9px;border:1px solid #40506f;background:#0d1422;color:#fff;text-align:center;font-size:16px}
input:focus{outline:2px solid #f3c94f;outline-offset:1px}.status{text-align:center;color:#9ba8c0;font-size:12px;margin-top:6px}.status.invalid{color:#ff9d9d}
table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:8px 6px;border-bottom:1px solid #2d3954;text-align:center;font-size:13px;white-space:nowrap}th{color:#aeb9cf}td.name{text-align:left;font-weight:700}.points{font-weight:800;color:#ffd76a}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#0e1523;border:1px solid #2d3954;border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat small{color:#9ba8c0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;padding:11px 14px;min-height:44px;font-weight:700;font-size:15px;cursor:pointer}.save,.add{background:#f3c94f;color:#111}.shuffle{background:#4f8df3;color:#fff}.reset{background:#5a242b;color:#fff}
.manager{background:#0e1523;border:1px solid #2d3954;border-radius:12px;padding:12px;margin-bottom:18px}.manager h3{margin:0 0 10px}.add-row{display:grid;grid-template-columns:1fr auto;gap:8px}.add-row input{text-align:left;padding:0 12px}.players{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{display:inline-flex;align-items:center;gap:5px;background:#24304a;border-radius:999px;padding:4px 5px 4px 10px}.chip button{width:32px;min-height:32px;padding:0;border-radius:50%;background:#5a242b;color:#fff;font-size:17px}.hint{color:#9ba8c0;font-size:12px;margin:8px 0 0}
@media(max-width:820px){.grid{grid-template-columns:1fr}.pair{grid-template-columns:minmax(54px,1fr) 52px 20px 52px minmax(54px,1fr);gap:5px}.pair b{font-size:14px}.hero,.card{padding:14px}}
@media(max-width:390px){main{padding-left:10px;padding-right:10px}.hero,.card{border-radius:14px;padding:12px}.pair{grid-template-columns:minmax(48px,1fr) 48px 18px 48px minmax(48px,1fr);gap:4px}.pair b{font-size:13px}.summary{gap:5px}.stat{padding:8px 4px}.stat b{font-size:18px}}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>🏓 ตีให้สุด หยุดที่เบ้าตา</h1>
<div class="sub" id="leagueInfo">Ping Pong League</div>
<div class="rules"><span class="pill">ชนะ 3 คะแนน</span><span class="pill">เสมอ 1 คะแนน</span><span class="pill">แพ้ 0 คะแนน</span><span class="pill">นับลูกได้ / ลูกเสีย / ผลต่าง</span></div>
</section>

<div class="grid">
<section class="card">
<div class="manager">
<h3>จัดการผู้เล่น</h3>
<div class="add-row"><input id="newPlayer" type="text" maxlength="30" placeholder="กรอกชื่อผู้เล่นใหม่" autocomplete="off"><button class="add" id="addPlayer" type="button">+ เพิ่มผู้เล่น</button></div>
<div class="players" id="playerList"></div>
<p class="hint">เพิ่มหรือลบผู้เล่นแล้วระบบจะสร้างตารางใหม่ • ต้องมีอย่างน้อย 2 คน</p>
<div class="actions"><button class="shuffle" id="shuffle" type="button">🔀 สุ่มจับคู่ใหม่</button></div>
</div>
<h2>กรอกผลการแข่งขัน</h2>
<div id="schedule"></div>
<div class="actions"><button class="save" id="save" type="button">บันทึก</button><button class="reset" id="reset" type="button">ล้างผลทั้งหมด</button></div>
</section>

<section class="card">
<h2>ตารางคะแนน</h2>
<div class="summary"><div class="stat"><b id="played">0</b><small>แข่งแล้ว</small></div><div class="stat"><b id="remain">21</b><small>เหลือ</small></div><div class="stat"><b id="leader">-</b><small>อันดับ 1</small></div></div>
<div class="wrap" role="region" aria-label="ตารางคะแนน เลื่อนซ้ายขวาเพื่อดูข้อมูลทั้งหมด" tabindex="0"><table>
<thead><tr><th>#</th><th style="text-align:left">ผู้เล่น</th><th>แข่ง</th><th>ชนะ</th><th>เสมอ</th><th>แพ้</th><th>ลูกได้</th><th>ลูกเสีย</th><th>+/-</th><th>คะแนน</th></tr></thead>
<tbody id="standings"></tbody>
</table></div>
</section>
</div>
</main>

<script>
const defaultPlayers=["พี่โช็ค","กิฟท์","กอล์ฟ","มังกร","พฤษ","เฟิร์น","มอส"];
const defaultRounds=[
 {rest:"เฟิร์น",m:[["กอล์ฟ","มังกร"],["พฤษ","พี่โช็ค"],["กิฟท์","มอส"]]},
 {rest:"พฤษ",m:[["กอล์ฟ","พี่โช็ค"],["มังกร","มอส"],["กิฟท์","เฟิร์น"]]},
 {rest:"พี่โช็ค",m:[["กอล์ฟ","มอส"],["มังกร","เฟิร์น"],["พฤษ","กิฟท์"]]},
 {rest:"กอล์ฟ",m:[["มอส","เฟิร์น"],["พี่โช็ค","กิฟท์"],["มังกร","พฤษ"]]},
 {rest:"กิฟท์",m:[["กอล์ฟ","เฟิร์น"],["มอส","พฤษ"],["พี่โช็ค","มังกร"]]},
 {rest:"มังกร",m:[["กอล์ฟ","กิฟท์"],["เฟิร์น","พฤษ"],["มอส","พี่โช็ค"]]},
 {rest:"มอส",m:[["กอล์ฟ","พฤษ"],["กิฟท์","มังกร"],["เฟิร์น","พี่โช็ค"]]}
];

const KEY="pp_league_v5",OLD_KEY="pp_league_v4";
let players=[...defaultPlayers],rounds=defaultRounds.map(r=>({rest:r.rest,m:r.m.map(p=>[...p])})),results={};
try{
 const saved=JSON.parse(localStorage.getItem(KEY)||"null");
 if(saved&&Array.isArray(saved.players)&&saved.players.length>=2&&Array.isArray(saved.rounds)){players=saved.players;rounds=saved.rounds;results=saved.results||{}}
 else results=JSON.parse(localStorage.getItem(OLD_KEY)||"{}")||{};
}catch(e){results={}}
const mid=(r,m)=>`r${r}m${m}`;
const validScore=value=>Number.isInteger(value)&&value>=0;
const totalMatches=()=>players.length*(players.length-1)/2;
const hasResults=()=>Object.keys(results).length>0;
const escapeHtml=value=>String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));

function saveState(){localStorage.setItem(KEY,JSON.stringify({players,rounds,results}))}

function shuffled(source){
 const a=[...source];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}

function makeRoundRobin(source){
 const rotation=shuffled(source);if(rotation.length%2)rotation.push(null);
 const output=[],size=rotation.length;
 for(let round=0;round<size-1;round++){
  const matches=[];let rest=null;
  for(let i=0;i<size/2;i++){
   const a=rotation[i],b=rotation[size-1-i];
   if(a&&b)matches.push(round%2?[b,a]:[a,b]);else rest=a||b;
  }
  output.push({rest,m:matches});rotation.splice(1,0,rotation.pop());
 }
 return output;
}

function rebuildSchedule(){rounds=makeRoundRobin(players);results={};saveState();render()}

function approveReset(message){return !hasResults()||confirm(message)}

function addPlayer(){
 const input=document.getElementById("newPlayer"),name=input.value.trim();
 if(!name){input.focus();return}
 if(players.some(p=>p.toLocaleLowerCase("th")===name.toLocaleLowerCase("th"))){alert("มีชื่อผู้เล่นนี้แล้ว");return}
 if(!approveReset("การเพิ่มผู้เล่นจะสร้างตารางใหม่และล้างผลการแข่งขันเดิม ดำเนินการต่อหรือไม่?"))return;
 players.push(name);input.value="";rebuildSchedule();
}

function removePlayer(index){
 if(players.length<=2){alert("ต้องมีผู้เล่นอย่างน้อย 2 คน");return}
 if(!approveReset(`ลบ ${players[index]} แล้วสร้างตารางใหม่หรือไม่? ผลการแข่งขันเดิมจะถูกล้าง`))return;
 players.splice(index,1);rebuildSchedule();
}

function renderPlayers(){
 const box=document.getElementById("playerList");box.innerHTML="";
 players.forEach((name,index)=>{
  const chip=document.createElement("span");chip.className="chip";
  const label=document.createElement("span");label.textContent=name;
  const remove=document.createElement("button");remove.type="button";remove.textContent="×";remove.setAttribute("aria-label",`ลบ ${name}`);remove.onclick=()=>removePlayer(index);
  chip.append(label,remove);box.appendChild(chip);
 });
}

function render(){
 renderPlayers();
 document.getElementById("leagueInfo").textContent=`Ping Pong League • ${players.length} คน • พบกันหมด ${totalMatches()} แมตช์`;
 const box=document.getElementById("schedule"); box.innerHTML="";
 rounds.forEach((r,ri)=>{
  const sec=document.createElement("div"); sec.className="round";
  sec.innerHTML=`<div class="rh"><b>รอบ ${ri+1}</b><span class="rest">${r.rest?`พัก: ${escapeHtml(r.rest)}`:"แข่งครบทุกคน"}</span></div>`;
  r.m.forEach((p,mi)=>{
   const id=mid(ri,mi),x=results[id]||{};
   const row=document.createElement("div"); row.className="match";
   row.innerHTML=`<div class="pair"><b class="left">${escapeHtml(p[0])}</b><input type="number" min="0" step="1" inputmode="numeric" pattern="[0-9]*" aria-label="คะแนน ${escapeHtml(p[0])} รอบ ${ri+1}" id="${id}a" value="${x.a??""}"><span>VS</span><input type="number" min="0" step="1" inputmode="numeric" pattern="[0-9]*" aria-label="คะแนน ${escapeHtml(p[1])} รอบ ${ri+1}" id="${id}b" value="${x.b??""}"><b>${escapeHtml(p[1])}</b></div><div class="status" id="${id}s" aria-live="polite">ยังไม่กรอกผล</div>`;
   sec.appendChild(row);
  });
  box.appendChild(sec);
 });
 rounds.forEach((r,ri)=>r.m.forEach((p,mi)=>{
  ["a","b"].forEach(side=>document.getElementById(mid(ri,mi)+side).addEventListener("input",()=>updateMatch(ri,mi)));
  label(ri,mi);
 }));
 calc();
}

function inputValue(element){return element.value===""?null:Number(element.value)}

function updateMatch(ri,mi){
 const id=mid(ri,mi),a=inputValue(document.getElementById(id+"a")),b=inputValue(document.getElementById(id+"b"));
 if(a===null&&b===null) delete results[id]; else results[id]={a,b};
 saveState(); label(ri,mi); calc();
}

function label(ri,mi){
 const id=mid(ri,mi),x=results[id],p=rounds[ri].m[mi],el=document.getElementById(id+"s");
 el.classList.remove("invalid");
 if(!x||x.a===null||x.b===null){el.textContent="ยังไม่กรอกผล";return}
 if(!validScore(x.a)||!validScore(x.b)){el.textContent="กรุณากรอกเลขจำนวนเต็มตั้งแต่ 0 ขึ้นไป";el.classList.add("invalid");return}
 el.textContent=x.a>x.b?`${p[0]} ชนะ ${x.a}-${x.b}`:x.b>x.a?`${p[1]} ชนะ ${x.b}-${x.a}`:`เสมอ ${x.a}-${x.b}`;
}

function calc(){
 const s={};players.forEach(n=>s[n]={name:n,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0});let played=0;
 rounds.forEach((r,ri)=>r.m.forEach((p,mi)=>{
  const x=results[mid(ri,mi)]; if(!x||!validScore(x.a)||!validScore(x.b))return; played++;
  const A=s[p[0]],B=s[p[1]];A.p++;B.p++;A.gf+=x.a;A.ga+=x.b;B.gf+=x.b;B.ga+=x.a;
  if(x.a>x.b){A.w++;A.pts+=3;B.l++}else if(x.b>x.a){B.w++;B.pts+=3;A.l++}else{A.d++;B.d++;A.pts++;B.pts++}
 }));
 Object.values(s).forEach(x=>x.gd=x.gf-x.ga);
 const arr=Object.values(s).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||b.w-a.w||a.name.localeCompare(b.name,"th"));
 document.getElementById("standings").innerHTML=arr.map((x,i)=>`<tr><td>${i+1}</td><td class="name">${i===0&&played?"👑 ":""}${escapeHtml(x.name)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gd>0?"+":""}${x.gd}</td><td class="points">${x.pts}</td></tr>`).join("");
 document.getElementById("played").textContent=played;document.getElementById("remain").textContent=totalMatches()-played;document.getElementById("leader").textContent=played?arr[0].name:"-";
}

document.getElementById("addPlayer").onclick=addPlayer;
document.getElementById("newPlayer").addEventListener("keydown",event=>{if(event.key==="Enter")addPlayer()});
document.getElementById("shuffle").onclick=()=>{if(approveReset("สุ่มตารางใหม่และล้างผลการแข่งขันเดิมหรือไม่?"))rebuildSchedule()};
document.getElementById("save").onclick=()=>{saveState();alert("บันทึกแล้ว")};
document.getElementById("reset").onclick=()=>{if(confirm("ล้างผลทั้งหมด?")){results={};saveState();render()}};
render();
</script>
</body>
</html>
