<section class="hero"><h1>โป๊กเกอร์</h1><div class="muted">จดซื้อชิป ซื้อเพิ่ม นับชิปตอนเลิก แล้วสรุปให้ว่าใครจ่ายใคร • ไม่ปนกับข้อมูลลีกปิงปอง</div><div class="rules"><span class="pill sync" id="pSync" role="status">กำลังเชื่อมต่อ…</span></div></section>

<section class="card" id="pSetup" hidden><h2>เปิดวงใหม่</h2>
 <div class="d-settings"><label>ซื้อชิป 1 ไม้ (บาท)<input type="number" inputmode="decimal" id="pBuyIn" min="1" value="100"></label><label>ได้ชิป<input type="number" inputmode="numeric" id="pChips" min="1" value="100"></label></div>
 <h3 class="p-sub">ใครเล่นบ้าง</h3>
 <div class="muted" id="pPickedCount" role="status"></div>
 <div id="pPeople" class="p-people"></div>
 <div class="p-add"><input id="pGuest" maxlength="30" placeholder="ชื่อแขก / คนนอกลีก" aria-label="ชื่อผู้เล่นเพิ่ม" autocomplete="off"><button type="button" class="secondary" id="pGuestAdd">+ เพิ่ม</button></div>
 <div class="actions"><button type="button" class="primary" id="pStart">เริ่มวง • ทุกคนซื้อ 1 ไม้</button></div>
</section>

<div id="pNight" hidden>
<section class="card"><h2>วงนี้</h2>
 <div class="muted" id="pMeta"></div>
 <div id="pPlayers" class="p-players"></div>
 <div class="p-add"><input id="pLate" maxlength="30" placeholder="มีคนมาเพิ่ม? พิมพ์ชื่อ" aria-label="ชื่อคนที่เข้าวงเพิ่ม" autocomplete="off"><button type="button" class="secondary" id="pLateAdd">+ เข้าวง</button></div>
 <div class="p-check" id="pCheck" role="status"></div>
 <div id="pPay" class="d-pay" hidden><h3>ใครจ่ายใคร</h3><div class="muted">คิดให้โอนน้อยครั้งที่สุด คนเสียมากสุดจ่ายคนได้มากสุดก่อน</div><div id="pPayList" class="d-pay-list"></div><button type="button" class="secondary" id="pPayCopy">คัดลอกไปส่งในไลน์</button></div>
 <div class="actions"><button type="button" class="secondary" id="pUndo">ย้อนรายการล่าสุด</button><button type="button" class="primary" id="pClose">จบวง</button></div>
</section>
</div>

<section class="card" id="pHistCard" hidden><h2>วงก่อน ๆ</h2><div id="pHist" class="d-days"></div></section>
<div class="d-toast" id="pToast" role="status" aria-live="polite"></div>
