<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin Portal</title>
  <meta name="theme-color" content="#0a0b0e">
  <script>try{var t=+sessionStorage.getItem("dopdep-pt");sessionStorage.removeItem("dopdep-pt");if(Date.now()-t<4000&&!matchMedia("(prefers-reduced-motion: reduce)").matches){document.documentElement.classList.add("pt-in");setTimeout(function(){document.documentElement.classList.remove("pt-in")},900)}}catch(e){}</script>
  <link rel="stylesheet" href="../fonts.css?v=20261018-arena">
  <link rel="stylesheet" href="../trade/style.css?v=3">
  <style>
    .apps { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); margin-top: 14px; }
    .app { display: flex; flex-direction: column; gap: 14px; transition: transform .15s, border-color .15s; }
    .app:hover { transform: translateY(-2px); border-color: var(--line2); }
    .app .head { display: flex; gap: 14px; align-items: center; }
    .app .icon { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 25px; flex: none;
      background: radial-gradient(circle at 30% 25%, var(--panel3), var(--field)); border: 1px solid rgba(255,71,82,.45);
      box-shadow: 0 0 18px var(--red-glow), inset 0 1px 0 rgba(255,255,255,.08); }
    .app h3 { margin: 0; font: italic 800 22px/1.1 var(--display); color: #fff; }
    .app p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .app .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .app .links a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: var(--r-sm);
      border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font-size: 13px; font-weight: 700; }
    .app .links a:hover { background: var(--panel3); }
    .app .links a.primary { color: #fff; border-color: #ff5c66; background: linear-gradient(180deg, #dc2530, #b0121a); box-shadow: 0 8px 22px var(--red-glow); }
    .app .live { font-size: 12px; color: var(--text2); background: var(--field); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; }
    .note { font-size: 12px; margin-top: 14px; }
    @keyframes bob { from { transform: translateY(0) rotate(0); } to { transform: translateY(-4px) rotate(-6deg); } }
    .app:hover .icon { animation: bob .6s ease-in-out infinite alternate; }
    .app .live.loaded { animation: fadeIn .45s var(--ease); }
  </style>
</head>
<body>
  <div id="root" class="wrap"><p class="muted">กำลังโหลด…</p></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../trade/config.js?v=1"></script>
  <script src="../trade/app.js?v=4"></script>
  <script src="switcher.js?v=2"></script>
  <script src="portal.js?v=5"></script>
</body>
</html>
